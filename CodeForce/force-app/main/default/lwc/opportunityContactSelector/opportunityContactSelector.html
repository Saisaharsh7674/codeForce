<template>
    <lightning-card title="Opportunity Contact Selection" icon-name="standard:contact">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">

            <!-- Step 1: Contact selection -->
            <template lwc:if={showStep1}>
                <template lwc:if={hasContacts}>
                    <lightning-datatable
                        key-field="Id"
                        data={pagedContacts}
                        columns={columns}
                        selected-rows={selectedRowIds}
                        onrowselection={handleRowSelection}>
                    </lightning-datatable>

                    <div class="slds-grid slds-grid_align-spread slds-m-top_small">
                        <lightning-button
                            label="Previous"
                            icon-name="utility:chevronleft"
                            disabled={isFirstPage}
                            onclick={handlePrevious}>
                        </lightning-button>
                        <span class="slds-align-middle">{pageInfo}</span>
                        <lightning-button
                            label="Next Page"
                            icon-name="utility:chevronright"
                            icon-position="right"
                            disabled={isLastPage}
                            onclick={handleNext}>
                        </lightning-button>
                    </div>

                    <div class="slds-m-top_medium slds-text-align_right">
                        <lightning-button
                            variant="brand"
                            label="Next"
                            disabled={isNextDisabled}
                            onclick={handleContinue}>
                        </lightning-button>
                    </div>
                </template>

                <template lwc:else>
                    <p class="slds-text-body_regular slds-p-vertical_medium">
                        No contacts on active accounts were found.
                    </p>
                </template>
            </template>

            <!-- Step 2: Assign roles for selected contacts -->
            <template lwc:if={showSelection}>
                <p class="slds-text-heading_small slds-m-bottom_small">
                    Assign a role for each selected contact
                </p>
                <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col"><div class="slds-truncate">Opportunity Id</div></th>
                            <th scope="col"><div class="slds-truncate">Selected Contact</div></th>
                            <th scope="col"><div class="slds-truncate">Role</div></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={selectedContacts} for:item="contact">
                            <tr key={contact.Id}>
                                <td><div class="slds-truncate">{recordId}</div></td>
                                <td><div class="slds-truncate">{contact.Name}</div></td>
                                <td>
                                    <lightning-combobox
                                        name="role"
                                        label="Role"
                                        variant="label-hidden"
                                        placeholder="Select a role"
                                        data-id={contact.Id}
                                        options={roleOptions}
                                        onchange={handleRoleChange}>
                                    </lightning-combobox>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>

                <div class="slds-grid slds-grid_align-spread slds-m-top_medium">
                    <lightning-button
                        label="Back"
                        icon-name="utility:chevronleft"
                        onclick={handleBack}>
                    </lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Save"
                        disabled={isSaveDisabled}
                        onclick={handleSave}>
                    </lightning-button>
                </div>

                <template lwc:if={isSaving}>
                    <lightning-spinner alternative-text="Saving" size="small"></lightning-spinner>
                </template>
            </template>

        </div>
    </lightning-card>
</template>
